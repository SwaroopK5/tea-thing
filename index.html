<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Image</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #111;
    }

    body {
      position: relative;
      display: grid;
      place-items: center;
    }

    .image,
    .document {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      border: 0;
      background: #111;
    }

    .image {
      object-fit: contain;
      object-position: center;
      user-select: none;
      -webkit-user-drag: none;
    }

    .glare {
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0;
      transition: opacity 180ms ease-out;
      background: radial-gradient(
        circle 180px at var(--x, 50%) var(--y, 50%),
        rgba(var(--glare-r, 255), var(--glare-g, 255), var(--glare-b, 255), 0.30),
        rgba(var(--glare-r, 255), var(--glare-g, 255), var(--glare-b, 255), 0.08) 45%,
        transparent 72%
      );
      mix-blend-mode: screen;
    }

    body:hover .glare { opacity: 1; }

    .pdf-blur,
    .pdf-page,
    .document {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      border: 0;
    }

    .pdf-blur {
      object-fit: cover;
      filter: blur(28px) brightness(0.72);
      transform: scale(1.08);
      background: #111;
    }

    .pdf-page {
      inset: 50% auto auto 50%;
      width: auto;
      height: auto;
      max-width: 100vw;
      max-height: 100vh;
      object-fit: contain;
      transform: translate(-50%, -50%);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
      background: #fff;
    }
  </style>
</head>
<body>
  <img class="image" src="image.jpg" alt="" />
  <div class="glare" aria-hidden="true"></div>

  <script>
    const body = document.body;
    const image = document.querySelector('.image');
    const glare = document.querySelector('.glare');

    body.addEventListener('pointermove', (event) => {
      body.style.setProperty('--x', `${event.clientX}px`);
      body.style.setProperty('--y', `${event.clientY}px`);
    });

    function setAverageColour(source) {
      const canvas = document.createElement('canvas');
      const size = 64;
      canvas.width = size;
      canvas.height = size;

      const context = canvas.getContext('2d', { willReadFrequently: true });
      context.drawImage(source, 0, 0, size, size);

      const pixels = context.getImageData(0, 0, size, size).data;
      let red = 0, green = 0, blue = 0;

      for (let index = 0; index < pixels.length; index += 4) {
        red += pixels[index];
        green += pixels[index + 1];
        blue += pixels[index + 2];
      }

      const count = pixels.length / 4;
      glare.style.setProperty('--glare-r', Math.round(red / count));
      glare.style.setProperty('--glare-g', Math.round(green / count));
      glare.style.setProperty('--glare-b', Math.round(blue / count));
    }

    function loadPdfJs() {
      if (window.pdfjsLib) return Promise.resolve(window.pdfjsLib);

      return new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
        script.onload = () => resolve(window.pdfjsLib);
        script.onerror = reject;
        document.head.appendChild(script);
      });
    }

    function renderNativePdfFallback() {
      const pdf = document.createElement('iframe');
      pdf.className = 'document';
      pdf.title = 'PDF document';
      pdf.src = 'image.pdf#toolbar=0&navpanes=0&view=FitH';
      body.insertBefore(pdf, glare);
    }

    async function renderPdf() {
      image.remove();

      try {
        const pdfjsLib = await loadPdfJs();
        pdfjsLib.GlobalWorkerOptions.workerSrc =
          'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        const pdf = await pdfjsLib.getDocument('image.pdf').promise;
        const page = await pdf.getPage(1);
        const baseViewport = page.getViewport({ scale: 1 });

        const pageCanvas = document.createElement('canvas');
        pageCanvas.className = 'pdf-page';

        const blurCanvas = document.createElement('canvas');
        blurCanvas.className = 'pdf-blur';

        body.insertBefore(blurCanvas, glare);
        body.insertBefore(pageCanvas, glare);

        const drawPage = () => {
          const viewportWidth = window.innerWidth;
          const viewportHeight = window.innerHeight;
          const pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
          const fitScale = Math.min(
            viewportWidth / baseViewport.width,
            viewportHeight / baseViewport.height
          );

          const renderViewport = page.getViewport({ scale: fitScale * pixelRatio });
          pageCanvas.width = renderViewport.width;
          pageCanvas.height = renderViewport.height;
          pageCanvas.style.width = `${renderViewport.width / pixelRatio}px`;
          pageCanvas.style.height = `${renderViewport.height / pixelRatio}px`;

          const pageTask = page.render({
            canvasContext: pageCanvas.getContext('2d', { alpha: false }),
            viewport: renderViewport
          });

          pageTask.promise.then(() => {
            setAverageColour(pageCanvas);

            blurCanvas.width = Math.max(1, Math.round(viewportWidth * pixelRatio));
            blurCanvas.height = Math.max(1, Math.round(viewportHeight * pixelRatio));

            const blurContext = blurCanvas.getContext('2d', { alpha: false });
            const pageRatio = pageCanvas.width / pageCanvas.height;
            const screenRatio = blurCanvas.width / blurCanvas.height;

            let sourceWidth = pageCanvas.width;
            let sourceHeight = pageCanvas.height;
            let sourceX = 0;
            let sourceY = 0;

            if (pageRatio > screenRatio) {
              sourceWidth = pageCanvas.height * screenRatio;
              sourceX = (pageCanvas.width - sourceWidth) / 2;
            } else {
              sourceHeight = pageCanvas.width / screenRatio;
              sourceY = (pageCanvas.height - sourceHeight) / 2;
            }

            blurContext.drawImage(
              pageCanvas,
              sourceX, sourceY, sourceWidth, sourceHeight,
              0, 0, blurCanvas.width, blurCanvas.height
            );
          });
        };

        drawPage();
        window.addEventListener('resize', drawPage);
      } catch (error) {
        console.error('Unable to render PDF:', error);
        renderNativePdfFallback();
      }
    }

    image.addEventListener('error', renderPdf, { once: true });
    image.addEventListener('load', () => {
      if (image.naturalWidth > 0) setAverageColour(image);
      else renderPdf();
    }, { once: true });

    if (image.complete) {
      if (image.naturalWidth > 0) setAverageColour(image);
      else if (image.getAttribute('src')) renderPdf();
    }
  </script>
</body>
</html>
