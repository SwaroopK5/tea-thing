<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=10, user-scalable=yes, viewport-fit=cover" />
  <title>Image</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      margin: 0;
      overflow: hidden;
      background: #111;
    }

    body {
      position: relative;
      display: grid;
      place-items: center;
      touch-action: auto;
      background-image: url("image.jpg");
      background-size: cover;
      background-position: center;
    }

    body::before {
      content: "";
      display: none;
    }

    .image,
    .document {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      border: 0;
      background: #111;
      touch-action: auto;
    }

    .image {
      z-index: 1;
      object-fit: contain;
      object-position: center;
      background: transparent;
      box-shadow: none;
    }

    .image-blur {
      position: fixed;
      inset: -32px;
      z-index: 0;
      width: calc(100vw + 64px);
      height: calc(100vh + 64px);
      object-fit: cover;
      object-position: center;
      filter: blur(28px) brightness(0.72);
      transform: scale(1.08);
      pointer-events: none;
    }

    .glare {
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0;
      transition: opacity 180ms ease-out;
      background: radial-gradient(
        circle 180px at var(--x, 50%) var(--y, 50%),
        rgba(var(--glare-r, 255), var(--glare-g, 255), var(--glare-b, 255), 0.30),
        rgba(var(--glare-r, 255), var(--glare-g, 255), var(--glare-b, 255), 0.08) 45%,
        transparent 72%
      );
      mix-blend-mode: screen;
      z-index: 3;
    }

    .pdf-blur,
    .pdf-page,
    .document {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      border: 0;
    }

    .pdf-blur {
      object-fit: cover;
      filter: blur(28px) brightness(0.72);
      transform: scale(1.08);
      background: #111;
    }

    .pdf-page {
      inset: auto;
      width: auto;
      height: auto;
      max-width: none;
      max-height: none;
      object-fit: contain;
      transform: none;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
      background: #fff;
    }

    .image,
    .image-blur {
      transition: none;
    }

    @supports (-webkit-overflow-scrolling: touch) {
      .image,
      .image-blur {
        backface-visibility: hidden;
      }
    }
  </style>
</head>
<body>
  <img class="image" src="image.jpg" alt="" />
  <div class="glare" aria-hidden="true"></div>

  <script>
    const body = document.body;
    const image = document.querySelector('.image');
    const glare = document.querySelector('.glare');

    body.addEventListener('pointermove', (event) => {
      body.style.setProperty('--x', `${event.clientX}px`);
      body.style.setProperty('--y', `${event.clientY}px`);
    });

    function setAverageColour(source) {
      const canvas = document.createElement('canvas');
      const size = 64;
      canvas.width = size;
      canvas.height = size;

      const context = canvas.getContext('2d', { willReadFrequently: true });
      context.drawImage(source, 0, 0, size, size);

      const pixels = context.getImageData(0, 0, size, size).data;
      let red = 0, green = 0, blue = 0;

      for (let index = 0; index < pixels.length; index += 4) {
        red += pixels[index];
        green += pixels[index + 1];
        blue += pixels[index + 2];
      }

      const count = pixels.length / 4;
      glare.style.setProperty('--glare-r', Math.round(red / count));
      glare.style.setProperty('--glare-g', Math.round(green / count));
      glare.style.setProperty('--glare-b', Math.round(blue / count));
    }

    function loadPdfJs() {
      if (window.pdfjsLib) return Promise.resolve(window.pdfjsLib);

      return new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
        script.onload = () => resolve(window.pdfjsLib);
        script.onerror = reject;
        document.head.appendChild(script);
      });
    }

    function renderNativePdfFallback() {
      const pdf = document.createElement('iframe');
      pdf.className = 'document';
      pdf.title = 'PDF document';
      pdf.src = 'image.pdf#toolbar=0&navpanes=0&view=FitH';
      body.insertBefore(pdf, glare);
    }

    function getVisibleViewport() {
      const viewport = window.visualViewport;
      return {
        width: viewport ? viewport.width : window.innerWidth,
        height: viewport ? viewport.height : window.innerHeight,
        left: viewport ? viewport.offsetLeft : 0,
        top: viewport ? viewport.offsetTop : 0,
        scale: viewport ? viewport.scale : 1
      };
    }

    async function renderPdf() {
      image.remove();

      try {
        const pdfjsLib = await loadPdfJs();
        pdfjsLib.GlobalWorkerOptions.workerSrc =
          'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        const pdf = await pdfjsLib.getDocument('image.pdf').promise;
        const page = await pdf.getPage(1);
        const baseViewport = page.getViewport({ scale: 1 });

        const pageCanvas = document.createElement('canvas');
        pageCanvas.className = 'pdf-page';

        const blurCanvas = document.createElement('canvas');
        blurCanvas.className = 'pdf-blur';

        body.insertBefore(blurCanvas, glare);
        body.insertBefore(pageCanvas, glare);

        let drawTimer;
        const drawPage = () => {
          window.clearTimeout(drawTimer);
          drawTimer = window.setTimeout(() => {
            const visible = getVisibleViewport();
            const viewportWidth = window.innerWidth;
            const viewportHeight = window.innerHeight;
            const deviceRatio = window.devicePixelRatio || 1;
            const pixelRatio = Math.min(deviceRatio * visible.scale, 4);

            const fitScale = Math.min(
              viewportWidth / baseViewport.width,
              viewportHeight / baseViewport.height
            );

            const renderScale = fitScale * pixelRatio;
            const renderViewport = page.getViewport({ scale: renderScale });
            const fittedWidth = renderViewport.width / pixelRatio;
            const fittedHeight = renderViewport.height / pixelRatio;
            pageCanvas.width = renderViewport.width;
            pageCanvas.height = renderViewport.height;
            pageCanvas.style.left = `${visible.left + (visible.width - fittedWidth) / 2}px`;
            pageCanvas.style.top = `${visible.top + (visible.height - fittedHeight) / 2}px`;
            pageCanvas.style.width = `${fittedWidth}px`;
            pageCanvas.style.height = `${fittedHeight}px`;

            const pageTask = page.render({
              canvasContext: pageCanvas.getContext('2d', { alpha: false }),
              viewport: renderViewport
            });

            pageTask.promise.then(() => {
              setAverageColour(pageCanvas);

              blurCanvas.width = Math.max(1, Math.round(visible.width * pixelRatio));
              blurCanvas.height = Math.max(1, Math.round(visible.height * pixelRatio));
              blurCanvas.style.left = `${visible.left}px`;
              blurCanvas.style.top = `${visible.top}px`;
              blurCanvas.style.width = `${visible.width}px`;
              blurCanvas.style.height = `${visible.height}px`;

              const blurContext = blurCanvas.getContext('2d', { alpha: false });
              const pageRatio = pageCanvas.width / pageCanvas.height;
              const screenRatio = blurCanvas.width / blurCanvas.height;

              let sourceWidth = pageCanvas.width;
              let sourceHeight = pageCanvas.height;
              let sourceX = 0;
              let sourceY = 0;

              if (pageRatio > screenRatio) {
                sourceWidth = pageCanvas.height * screenRatio;
                sourceX = (pageCanvas.width - sourceWidth) / 2;
              } else {
                sourceHeight = pageCanvas.width / screenRatio;
                sourceY = (pageCanvas.height - sourceHeight) / 2;
              }

              blurContext.drawImage(
                pageCanvas,
                sourceX, sourceY, sourceWidth, sourceHeight,
                0, 0, blurCanvas.width, blurCanvas.height
              );
            });
          }, 80);
        };

        drawPage();
        window.addEventListener('resize', drawPage);
        window.visualViewport?.addEventListener('resize', drawPage);
        window.visualViewport?.addEventListener('scroll', drawPage);
      } catch (error) {
        console.error('Unable to render PDF:', error);
        renderNativePdfFallback();
      }
    }

    const imageBlur = document.createElement('img');
    imageBlur.className = 'image-blur';
    imageBlur.alt = '';
    imageBlur.src = 'image.jpg';
    body.insertBefore(imageBlur, image);

    image.addEventListener('error', renderPdf, { once: true });
    image.addEventListener('load', () => {
      if (image.naturalWidth > 0) setAverageColour(image);
      else renderPdf();
    }, { once: true });

    if (image.complete) {
      if (image.naturalWidth > 0) setAverageColour(image);
      else if (image.getAttribute('src')) renderPdf();
    }
  </script>
</body>
</html>
